<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A0E1E}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.hf-b:focus-visible,.hf-row:focus-visible,.hf-back:focus-visible{outline:2px solid #74D447;outline-offset:-2px}
.hf-row{transition:background .15s}.hf-row:hover{background:#33243A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1F1023; color: #F6EEF8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 62px 20px 12px 20px">
  <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px">Activity</h1>
  <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
    <section aria-label="{{g.title}}" style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: #B9A8C0">{{g.title}}</h2>
      <div style="border-radius: 22px; background: #2A1C2F; display: flex; flex-direction: column">
        <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 68px; padding: 10px 12px 10px 14px; box-sizing: border-box; border-bottom: {{n.divider}}">
            <span style="position: relative; flex-shrink: 0">
              <sc-if value="{{n.isPerson}}" hint-placeholder-val="{{true}}"><span style="{{n.avatar}}">{{n.initial}}</span></sc-if>
              <sc-if value="{{n.isFlower}}" hint-placeholder-val="{{false}}"><span style="{{n.avatar}}"><dc-import name="Flower" kind="{{n.kind}}" stage="{{n.stage}}" health="{{n.health}}" size="38" hint-size="38px,38px"></dc-import></span></sc-if>
              <span style="{{n.badgeStyle}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="{{n.iconFill}}" stroke="{{n.iconStroke}}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg></span>
            </span>
            <div style="flex: 1; min-width: 0">
              <p style="margin: 0; font-size: 14.5px; font-weight: 500; line-height: 1.35"><span style="font-weight: 700">{{n.name}}</span> {{n.text}}</p>
              <p style="margin: 2px 0 0 0; font-size: 12px; font-weight: 500; color: #8C7992">{{n.when}}</p>
            </div>
            <sc-if value="{{n.hasThumb}}" hint-placeholder-val="{{false}}">
              <span aria-hidden="true" style="width: 42px; height: 42px; flex-shrink: 0; border-radius: 10px; background: radial-gradient(120% 80% at 70% 20%, #5A4A65, #241A2B)"></span>
            </sc-if>
            <sc-if value="{{n.hasAction}}" hint-placeholder-val="{{false}}">
              <a class="hf-b" href="{{n.href}}" style="height: 36px; padding: 0 14px; border-radius: 18px; background: rgba(116,212,71,0.22); color: #B8EE98; font-size: 13.5px; font-weight: 800; display: inline-flex; align-items: center; flex-shrink: 0">{{n.action}}</a>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </section>
  </sc-for>
  </div>
  <nav aria-label="Main" style="height: 84px; flex-shrink: 0; box-sizing: border-box; padding: 8px 12px 26px 12px; background: #180B1B; border-top: 1px solid #33243A; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <a class="hf-tab" href="Main.dc.html" style="color: #A895AE; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-8"></path><path d="M12 13c0-3 2-5 5-5 0 3-2 5-5 5z"></path><path d="M12 15c0-2.5-1.8-4.5-4.5-4.5 0 2.5 1.8 4.5 4.5 4.5z"></path><circle cx="12" cy="6" r="3"></circle></svg>
      Habits
    </a>
    <a class="hf-tab" href="Tasks.dc.html" style="color: #A895AE; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600">
      <span style="position: relative; display: inline-flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M8.5 12l2.5 2.5 4.5-5"></path></svg></span>
      Tasks
    </a>
    <a class="hf-tab" href="CreateChooser.dc.html" aria-label="Add a habit or task" style="display: flex; align-items: flex-start; justify-content: center">
      <span style="width: 56px; height: 56px; margin-top: -22px; border-radius: 28px; background: #74D447; color: #142008; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 6px #180B1B">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </span>
    </a>
    <a class="hf-tab" href="Friends.dc.html" style="color: #A895AE; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="3.5"></circle><circle cx="17" cy="10" r="2.5"></circle><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"></path><path d="M15.5 14.2c2.8 0 5 1.8 5 4.8"></path></svg>
      Friends
    </a>
    <a class="hf-tab" href="Notifications.dc.html" aria-current="page" style="color: #74D447; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4"></path></svg>
      Activity
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var P = { maya: ['@mayac', 'M', '#FFC93C', '#3A2600'], sam: ['@sampatel', 'S', '#A98BEA', '#1F1023'], priya: ['@priya.n', 'P', '#FF9F1C', '#2A1206'], jordan: ['@jordanlee', 'J', '#4FD1C5', '#0F2A27'] };
    var K = {
      react: ['M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z', '#F28FB8', 'currentColor', 'none'],
      nudge: ['M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4', '#7AA7FF', 'none', '#0F1E3A'],
      task: ['M5 12.5l4.5 4.5L19 7.5', '#74D447', 'none', '#142008'],
      join: ['M12 21v-8M12 13c0-3 2-5 5-5 0 3-2 5-5 5zM12 15c0-2.5-1.8-4.5-4.5-4.5 0 2.5 1.8 4.5 4.5 4.5z', '#FFC93C', 'none', '#3A2600'],
      friend: ['M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c0-3.4 2.9-5.8 6.5-5.8s6.5 2.4 6.5 5.8M19 8v6M16 11h6', '#4FD1C5', 'none', '#0F2A27']
    };
    var F = { gym: ['Hit the gym', 'lavender', 'bloom', 'ok', '169,139,234'], read: ['Read 20 pages', 'daisy', 'bloom', 'wilt', '247,242,234'], push: ['Push-ups', 'marigold', 'bloom', 'ok', '255,159,28'] };
    K.window = ['M12 7v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z', '#C59BF5', 'none', '#1F1023'];
    K.wilt = ['M12 4v8M12 16h.01', '#FF9E6B', 'none', '#2A1206'];
    K.bloom = ['M12 3l2.4 5 5.6.8-4 3.9 1 5.5-5-2.7-5 2.7 1-5.5-4-3.9 5.6-.8z', '#FFC93C', '#3A2600', 'none'];
    var data = [
      ['New', [
        ['sam', 'nudge', 'nudged you on Morning walk', '5 min ago', { action: 'Check in', href: 'GroupDetail.dc.html' }],
        ['@gym', 'window', 'closes in 30 min', '7:30 PM', { action: 'Snap', href: 'Camera.dc.html' }],
        ['@read', 'wilt', 'is wilting. Check in today to perk it up.', '9:00 AM', {}]
      ]],
      ['Earlier', [
        ['maya', 'react', 'reacted to your Hit the gym check-in', 'Yesterday', { thumb: true }],
        ['@push', 'bloom', 'reached full bloom', 'Yesterday', {}],
        ['sam', 'join', 'left Morning walk', 'Thursday', {}]
      ]]
    ];
    return {
      groups: data.map(function (g) {
        return { title: g[0], items: g[1].map(function (n, i) {
          var isF = n[0].charAt(0) === '@';
          var f = isF ? F[n[0].slice(1)] : null;
          var p = isF ? [f[0], '', 'rgba(' + f[4] + ',0.16)', '#F6EEF8'] : P[n[0]], k = K[n[1]];
          return { name: p[0], initial: p[1], text: n[2], when: n[3], isFlower: isF, isPerson: !isF,
            kind: f ? f[1] : '', stage: f ? f[2] : '', health: f ? f[3] : 'ok',
            avatar: 'width: 42px; height: 42px; border-radius: ' + (isF ? '12px' : '21px') + '; background: ' + p[2] + '; color: ' + p[3] + '; display: flex; align-items: ' + (isF ? 'flex-end' : 'center') + '; justify-content: center; overflow: hidden; font-size: 15px; font-weight: 800;',
            badgeStyle: 'position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 10px; background: ' + k[1] + '; color: #2A0E1A; box-shadow: 0 0 0 2px #2A1C2F; display: flex; align-items: center; justify-content: center;',
            icon: k[0], iconFill: k[2], iconStroke: k[3],
            hasThumb: !!n[4].thumb, hasAction: !!n[4].action, action: n[4].action || '', href: n[4].href || '',
            divider: i < g[1].length - 1 ? '1px solid #3D2D43' : 'none' };
        }) };
      })
    };
  }
}
</script>
</body>
</html>
