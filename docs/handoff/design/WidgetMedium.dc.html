<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget: medium HabitFlowers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A0E1E}
h1,.hf-display,div[role="status"]>h2{font-family:'Young Serif',Georgia,serif!important;font-weight:400!important;letter-spacing:-0.3px!important}
x-dc>div{position:relative}div[style*="border-radius"],section[style*="border-radius"],article[style*="border-radius"]{corner-shape:squircle}
</style>
</helmet>
<div style="width: 364px; height: 170px; box-sizing: border-box; padding: 14px 14px 12px 14px; background: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22140%22%20height%3D%22140%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.85%22%20numOctaves%3D%223%22%20stitchTiles%3D%22stitch%22%2F%3E%3CfeColorMatrix%20values%3D%220%200%200%200%201%20%200%200%200%200%201%20%200%200%200%200%201%20%200%200%200%200.07%200%22%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20filter%3D%22url%28%23n%29%22%2F%3E%3C%2Fsvg%3E') 0 0 / 140px 140px, #241628; color: #F6EEF8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; overflow: hidden">
  <div style="display: flex; justify-content: space-between; align-items: baseline">
    <p style="margin: 0; font-size: 15px; font-weight: 800">My HabitFlowers</p>
    <p style="margin: 0; font-size: 12.5px; font-weight: 700; color: #C9B9CF; display: flex; align-items: center; gap: 4px">5 left today</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px">
    <sc-for list="{{habits}}" as="h" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <div style="position: relative; width: 60px; height: 60px">
          <dc-import name="Flower" kind="{{h.kind}}" stage="{{h.stage}}" health="{{h.health}}" size="60" hint-size="60px,60px"></dc-import>
          <sc-if value="{{h.hasCount}}" hint-placeholder-val="{{false}}"><span style="{{h.countStyle}}">{{h.count}}</span></sc-if>
          <span style="{{h.badgeStyle}}">
            <sc-if value="{{h.isDue}}" hint-placeholder-val="{{true}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#74D447" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"></path></svg></sc-if>
            <sc-if value="{{h.isDone}}" hint-placeholder-val="{{false}}">
              <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#142008" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </sc-if>
            <sc-if value="{{h.isRest}}" hint-placeholder-val="{{false}}">
              <svg width="9" height="9" viewBox="0 0 24 24" fill="#E4D7E9" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
            </sc-if>
            <sc-if value="{{h.isLater}}" hint-placeholder-val="{{false}}"><svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#E4D7E9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5V12l3 2"></path></svg></sc-if>
          </span>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":364,"height":170}}'>
class Component extends DCLogic {
  renderVals() {
    var data = [
      { name: 'Push-ups', kind: 'marigold', stage: 'bloom', count: 4, status: 'due' },
      { name: 'Scales', kind: 'tulip', stage: 'bud', status: 'due' },
      { name: 'Gym', kind: 'lavender', stage: 'bloom', count: 12, status: 'later' },
      { name: 'Read', kind: 'daisy', stage: 'bud', health: 'dormant', status: 'due' },
      { name: 'Water', kind: 'sunflower', stage: 'bloom', count: 21, status: 'due' },
      { name: 'Walk', kind: 'rose', stage: 'bloom', health: 'wilt', count: 3, status: 'due' }
    ];
    var badgeBase = 'position: absolute; top: 0; right: 0; width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #241628;';
    return {
      habits: data.map(function (h) {
        var bg = h.status === 'due' ? '#241628' : (h.status === 'done' ? '#74D447' : '#4A3950');
        return {
          name: h.name, kind: h.kind, stage: h.stage, health: h.health || 'ok', hasCount: !!h.count, count: String(h.count || ''), countStyle: 'position: absolute; right: -4px; bottom: 2px; min-width: 19px; height: 17px; padding: 0 5px; box-sizing: border-box; border-radius: 8px; background: #3D2D43; box-shadow: 0 0 0 2px #241628; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center;' + (h.health === 'wilt' ? ' color: #FFB894;' : ' color: #F6EEF8;'),
          isDue: h.status === 'due', isDone: h.status === 'done', isRest: h.status === 'rest', isLater: h.status === 'later',
          badgeStyle: badgeBase + 'background: ' + bg + ';' + (h.status === 'due' ? ' top: -9px; right: auto; left: 50%; transform: translateX(-50%); width: auto; height: auto; background: none; box-shadow: none;' : '')
        };
      })
    };
  }
}
</script>
</body>
</html>
