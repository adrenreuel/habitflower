<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera: photo check-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A0E1E}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.hf-b:focus-visible{outline:2px solid #C59BF5;outline-offset:2px}
.hf-shutter{transition:transform .12s}.hf-shutter:active{transform:scale(.92)}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #000; color: #F6EEF8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 58px 16px 12px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a class="hf-b" href="GymDetail.dc.html" aria-label="Close camera" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
        <span style="font-size: 16px; font-weight: 800">Hit the gym</span>
        <span style="font-size: 12.5px; font-weight: 600; color: #C9B9CF">Open until 8:00 PM</span>
      </div>
      <button class="hf-b" onClick="{{toggleFlash}}" aria-pressed="{{flashAttr}}" aria-label="Flash" style="{{flashStyle}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L5 13.5h5.5L10 22l9-12h-6z"></path></svg>
      </button>
    </div>
    <sc-if value="{{multi}}" hint-placeholder-val="{{true}}">
      <div aria-label="{{progressAria}}" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 0 4px">
        <sc-for list="{{segments}}" as="g" hint-placeholder-count="2"><span style="{{g.style}}"></span></sc-for>
      </div>
    </sc-if>
  </div>

  <div style="position: relative; flex: 1; margin: 0 8px; border-radius: 28px; overflow: hidden; background: radial-gradient(120% 80% at 70% 20%, #4A3A55 0%, #241A2B 55%, #120B16 100%)">
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 38%; background: linear-gradient(180deg, #2B2130, #1A121E)"></div>
    <div aria-hidden="true" style="position: absolute; left: 14%; right: 14%; bottom: 30%; height: 10px; border-radius: 5px; background: #6E6276"></div>
    <div aria-hidden="true" style="position: absolute; left: 9%; bottom: calc(30% - 22px); width: 30px; height: 54px; border-radius: 8px; background: #3E3445"></div>
    <div aria-hidden="true" style="position: absolute; right: 9%; bottom: calc(30% - 22px); width: 30px; height: 54px; border-radius: 8px; background: #3E3445"></div>
    <div aria-hidden="true" style="position: absolute; right: 12%; top: 14%; width: 90px; height: 90px; border-radius: 45px; background: rgba(255,230,190,0.16); filter: blur(10px)"></div>

    <sc-if value="{{isReview}}" hint-placeholder-val="{{false}}">
      <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(255,255,255,0.04)"></div>
      <span style="position: absolute; left: 14px; top: 14px; height: 30px; padding: 0 12px; border-radius: 15px; background: rgba(0,0,0,0.5); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center">{{reviewLabel}}</span>
    </sc-if>
    <sc-if value="{{isCapture}}" hint-placeholder-val="{{true}}">
      <span style="position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); height: 34px; padding: 0 14px; border-radius: 17px; background: rgba(0,0,0,0.5); font-size: 13.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg>
        @mayac and @sampatel
      </span>
    </sc-if>
  </div>

  <div style="height: 196px; flex-shrink: 0; box-sizing: border-box; padding: 22px 28px 40px 28px; display: flex; align-items: center; justify-content: space-between">
    <sc-if value="{{isCapture}}" hint-placeholder-val="{{true}}">
      <span style="{{thumbStyle}}" aria-label="{{thumbAria}}"></span>
      <button class="hf-b hf-shutter" onClick="{{shoot}}" aria-label="Take photo" style="width: 82px; height: 82px; border-radius: 41px; border: none; padding: 0; background: #F6EEF8; box-shadow: inset 0 0 0 5px #000; cursor: pointer"></button>
      <button class="hf-b" onClick="{{flip}}" aria-label="Switch camera" style="width: 52px; height: 52px; border-radius: 26px; border: none; background: rgba(255,255,255,0.12); color: #F6EEF8; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><path d="M9 13.5a3 3 0 0 0 5.2 1.6M15 12.5a3 3 0 0 0-5.2-1.6"></path><path d="M14.5 16.5l-.3-1.4 1.4-.3M9.5 9.5l.3 1.4-1.4.3"></path></svg>
      </button>
    </sc-if>
    <sc-if value="{{isReview}}" hint-placeholder-val="{{false}}">
      <div style="width: 100%; display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px">
        <button class="hf-b" onClick="{{retake}}" style="height: 56px; border-radius: 28px; border: none; background: rgba(255,255,255,0.14); color: #F6EEF8; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Retake</button>
        <button class="hf-b" onClick="{{usePhoto}}" style="height: 56px; border-radius: 28px; border: none; background: #C59BF5; color: #1F1023; font: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
          <sc-if value="{{isLast}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
          {{useLabel}}
        </button>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: absolute; inset: 0; z-index: 5; background: #1F1023; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 32px; text-align: center">
      <div style="width: 180px; height: 180px; border-radius: 56px; background: rgba(169,139,234,0.14); display: flex; align-items: center; justify-content: center">
        <dc-import name="Flower" kind="lavender" stage="bloom" size="140" hint-size="140px,140px"></dc-import>
      </div>
      <h1 style="margin: 0; font-size: 28px; font-weight: 800">Checked in</h1>
      <p style="margin: 0; font-size: 16px; font-weight: 500; color: #B9A8C0">Your Lavender is in bloom.</p>
      <a class="hf-b" href="GymDetail.dc.html" style="margin-top: 10px; height: 54px; width: 100%; border-radius: 27px; background: #C59BF5; color: #1F1023; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">Done</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"photos":{"type":"enum","options":["1","2"],"default":"2"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { taken: 0, mode: 'capture', flash: false };
  }
  renderVals() {
    var self = this, st = this.state;
    var need = parseInt(this.props.photos || '2', 10);
    var current = st.mode === 'review' ? st.taken + 1 : st.taken + 1;
    var isLast = current >= need;
    return {
      multi: need > 1,
      progressAria: 'Photo ' + Math.min(current, need) + ' of ' + need,
      segments: (need > 1 ? [0, 1] : []).map(function (i) {
        var filled = i < st.taken || (st.mode === 'review' && i === st.taken);
        return { style: 'height: 4px; border-radius: 2px; background: ' + (filled ? '#C59BF5' : 'rgba(255,255,255,0.25)') + ';' };
      }),
      isCapture: st.mode === 'capture', isReview: st.mode === 'review', isDone: st.mode === 'done',
      reviewLabel: 'Photo ' + current + ' of ' + need,
      isLast: isLast,
      useLabel: isLast ? 'Check in' : 'Next photo',
      thumbAria: st.taken ? st.taken + ' photo taken' : 'No photos yet',
      thumbStyle: 'width: 52px; height: 52px; border-radius: 14px; box-sizing: border-box;' + (st.taken ? ' background: radial-gradient(120% 80% at 70% 20%, #5A4A65, #241A2B); box-shadow: 0 0 0 2px #F6EEF8;' : ' background: rgba(255,255,255,0.08);'),
      flashAttr: st.flash ? 'true' : 'false',
      flashStyle: 'width: 44px; height: 44px; border-radius: 22px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;' + (st.flash ? ' background: #FFD24A; color: #2A1F00;' : ' background: rgba(255,255,255,0.12); color: #F6EEF8;'),
      toggleFlash: function () { self.setState({ flash: !self.state.flash }); },
      shoot: function () { self.setState({ mode: 'review' }); },
      retake: function () { self.setState({ mode: 'capture' }); },
      flip: function () {},
      usePhoto: function () {
        var t = self.state.taken + 1;
        self.setState(t >= need ? { taken: t, mode: 'done' } : { taken: t, mode: 'capture' });
      }
    };
  }
}
</script>
</body>
</html>
