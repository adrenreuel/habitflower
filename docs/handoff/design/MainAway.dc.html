<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Habitflower home: habit grid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A0E1E}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.hf-card:hover{background:#33243A}
.hf-card:focus-visible,.hf-icon-btn:focus-visible,.hf-tab:focus-visible{outline:2px solid #74D447;outline-offset:2px}
h1,.hf-display,div[role="status"]>h2{font-family:'Young Serif',Georgia,serif!important;font-weight:400!important;letter-spacing:-0.3px!important}
x-dc>div{position:relative}div[style*="border-radius"],section[style*="border-radius"],article[style*="border-radius"]{corner-shape:squircle}
</style>
</helmet>
<div style="width: 390px; height: 1380px; box-sizing: border-box; background: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22140%22%20height%3D%22140%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.85%22%20numOctaves%3D%223%22%20stitchTiles%3D%22stitch%22%2F%3E%3CfeColorMatrix%20values%3D%220%200%200%200%201%20%200%200%200%200%201%20%200%200%200%200%201%20%200%200%200%200.07%200%22%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20filter%3D%22url%28%23n%29%22%2F%3E%3C%2Fsvg%3E') 0 0 / 140px 140px, #1A0C1D; color: #F6EEF8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <header style="position: relative; z-index: 2; padding: 62px 20px 4px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <p style="margin: 0; font-size: 14px; font-weight: 600; color: #B9A8C0">Saturday, Nov 14</p>
        <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.5px">My HabitFlowers</h1>
      </div>
      <a class="hf-b" href="Settings.dc.html" aria-label="Settings" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; background: #2A1C2F; color: #E4D7E9; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></a>
    </div>

  </header>

  <main aria-hidden="{{awayAttr}}" inert="{{awayInert}}" style="flex: 1; padding: 16px 20px 0 20px; overflow: hidden">
    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
      <section aria-label="{{sec.title}}" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px">
        <sc-if value="{{sec.hasTitle}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; align-items: baseline; gap: 6px">
            <h2 style="margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: {{sec.color}}">{{sec.title}}</h2>
            <span style="font-size: 13px; font-weight: 600; color: #8C7992">({{sec.count}})</span>
          </div>
        </sc-if>
        <div style="{{sec.listStyle}}">
          <sc-for list="{{sec.items}}" as="h" hint-placeholder-count="2">
            <a class="hf-card" href="{{h.href}}" aria-label="{{h.label}}" style="opacity: {{h.dim}}; {{h.sizeStyle}} display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #2A1C2F; border-radius: 20px; min-height: 160px; box-sizing: border-box">
              <div style="display: flex; justify-content: space-between; align-items: flex-start">
                <div style="position: relative; width: 52px; height: 52px; border-radius: 16px; background: {{h.tint}}; display: flex; align-items: center; justify-content: center">
    <dc-import name="Flower" kind="{{h.kind}}" stage="{{h.stage}}" health="{{h.health}}" size="44" hint-size="44px,44px"></dc-import>
                  <sc-if value="{{h.hasCount}}" hint-placeholder-val="{{false}}">
                    <span aria-label="{{h.countAria}}" style="{{h.countStyle}}">{{h.count}}</span>
                  </sc-if>
                </div>
                <span style="{{h.chipStyle}}">
                  <sc-if value="{{h.isDone}}" hint-placeholder-val="{{false}}">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                  </sc-if>
                  <sc-if value="{{h.isLater}}" hint-placeholder-val="{{false}}">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5V12l3 2"></path></svg>
                  </sc-if>
                  <sc-if value="{{h.isSnap}}" hint-placeholder-val="{{false}}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
                  </sc-if>
                  {{h.chip}}
                </span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 2px">
                <p style="margin: 0; font-size: 16px; font-weight: 700; line-height: 1.25">{{h.name}}</p>
                <p style="margin: 0; font-size: 13px; font-weight: 600; color: {{h.metaColor}}; display: flex; align-items: center; gap: 8px">
                  {{h.meta}}<sc-if value="{{h.isGroup}}" hint-placeholder-val="{{false}}"><span aria-label="With 2 friends" style="display: inline-flex; padding-left: 5px"><sc-for list="{{h.group}}" as="g" hint-placeholder-count="2"><span style="{{g.style}}">{{g.initial}}</span></sc-for></span></sc-if></p>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: auto" aria-hidden="true">
                <sc-for list="{{h.week}}" as="d" hint-placeholder-count="7">
                  <span style="{{d.style}}"></span>
                </sc-for>
              </div>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>
    <a href="Archived.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; margin-top: 6px; font-size: 14px; font-weight: 600; color: #A895AE">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M10 9v6M14 9v6"></path></svg>
      Paused habits
    </a>
  </main>

  <nav aria-label="Main" style="position: relative; z-index: 2; height: 84px; box-sizing: border-box; padding: 8px 12px 26px 12px; background: #2F1F36; box-shadow: 0 -10px 28px rgba(0,0,0,0.38); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
    <button class="hf-tab" aria-current="page" style="border: none; background: none; color: {{accent}}; display: flex; flex-direction: column; align-items: center; gap: 3px; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-8"></path><path d="M12 13c0-3 2-5 5-5 0 3-2 5-5 5z"></path><path d="M12 15c0-2.5-1.8-4.5-4.5-4.5 0 2.5 1.8 4.5 4.5 4.5z"></path><circle cx="12" cy="6" r="3"></circle></svg>
      Habits
    </button>
    <a class="hf-tab" href="Tasks.dc.html" style="color: #A895AE; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600">
      <span style="position: relative; display: inline-flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"></rect><path d="M8.5 12l2.5 2.5 4.5-5"></path></svg><span aria-label="3 tasks need attention, 1 overdue" style="position: absolute; top: -5px; right: -9px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #FF9E6B; color: #2A1206; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #180B1B">3</span></span>
      Tasks
    </a>
    <a class="hf-tab" href="CreateChooser.dc.html" aria-label="Add a habit or task" style="display: flex; align-items: center; margin-top: -4px; justify-content: center">
      <span style="width: 52px; height: 40px; border-radius: 20px; background: #74D447; color: #142008; display: flex; align-items: center; justify-content: center">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </span>
    </a>
    <a class="hf-tab" href="Friends.dc.html" style="color: #A895AE; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="3.5"></circle><circle cx="17" cy="10" r="2.5"></circle><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"></path><path d="M15.5 14.2c2.8 0 5 1.8 5 4.8"></path></svg>
      Friends
    </a>
    <a class="hf-tab" href="Notifications.dc.html" style="color: #A895AE; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600">
      <span style="position: relative; display: inline-flex"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4"></path></svg><span aria-label="3 new" style="position: absolute; top: -5px; right: -9px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: #FF9E6B; color: #2A1206; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #180B1B">3</span></span>
      Activity
    </a>
  </nav>
  <sc-if value="{{isAway}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; z-index: 1; background: rgba(20,9,24,0.74); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; flex-direction: column; align-items: center; padding: 250px 28px 0 28px">
      <div role="status" style="width: 100%; padding: 0 6px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
        <span aria-hidden="true" style="width: 72px; height: 72px; border-radius: 24px; background: rgba(122,167,255,0.18); color: #A9C6FF; display: flex; align-items: center; justify-content: center; margin-bottom: 4px"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a8 8 0 0 1 16 0zM12 11l-2.5 8.5M5 20.5h10"></path></svg></span>
        <h2 style="margin: 0; font-size: 28px; color: #E3ECFF">You’re away</h2>
        <p style="margin: 0; font-size: 14.5px; font-weight: 500; line-height: 1.45; color: #A9B8D9">Your HabitFlowers won’t wilt, and reminders are off until you’re back.</p>
        <button class="hf-card" onClick="{{turnOffAway}}" style="margin-top: 14px; width: 100%; height: 52px; border-radius: 26px; border: none; background: #F6EEF8; color: #1F1023; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">I’m back</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#74D447","options":["#74D447","#5BC424","#9BE36F"]},"$preview":{"width":390,"height":1380}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { awayOff: false };
  }
  renderVals() {
    var accent = this.props.accent ?? '#74D447';
    function hexA(hex, a) {
      var n = parseInt(hex.slice(1), 16);
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    }
    function dot(state, color) {
      var base = 'width: 12px; height: 12px; border-radius: 6px; box-sizing: border-box; display: block;';
      if (state === 'done') return base + 'background: ' + color + ';';
      if (state === 'part') return base + 'background: ' + hexA(color, 0.4) + ';';
      if (state === 'miss') return base + 'background: rgba(255,158,107,0.55);';
      if (state === 'todayDone') return base + 'background: ' + color + '; box-shadow: 0 0 0 2px #2A1C2F, 0 0 0 4px ' + color + ';';
      if (state === 'today') return base + 'background: ' + hexA(color, 0.4) + '; box-shadow: 0 0 0 2px #2A1C2F, 0 0 0 4px ' + color + ';';
      if (state === 'todayRest') return base + 'background: #3D2D43; box-shadow: 0 0 0 2px #2A1C2F, 0 0 0 4px #6E5B74;';
      return 'width: 12px; height: 4px; border-radius: 2px; display: block; background: #3D2D43;';
    }
    var chipBase = 'display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; font-weight: 700; box-sizing: border-box;';
    function chip(kind, color) {
      if (kind === 'done') return chipBase + 'background: ' + color + '; color: #1F1023;';
      if (kind === 'progress') return chipBase + 'background: ' + hexA(color, 0.2) + '; color: ' + color + ';';
      if (kind === 'snap') return chipBase + 'background: ' + color + '; color: #1F1023;';
      if (kind === 'later') return chipBase + 'background: #3D2D43; color: #C9B9CF;';
      if (kind === 'rest') return 'display: none;';
      return chipBase + 'background: #3D2D43; color: #C9B9CF;';
    }
    var raw = [
      { name: 'Push-ups', flower: 'marigold', color: '#FF9F1C', stage: 'bloom', count: 4, chip: '1/3', kind: 'progress', meta: '3 times a day', href: 'Detail.dc.html', week: ['miss','done','done','done','done','done','today'] },
      { name: 'Practice scales', flower: 'tulip', color: '#FF6B8A', stage: 'bud', chip: 'Rest day', kind: 'rest', meta: 'Next: Monday', href: 'Detail.dc.html', week: ['off','miss','off','miss','off','done','todayRest'] },
      { name: 'Hit the gym', flower: 'lavender', photo: true, color: '#A98BEA', stage: 'bloom', count: 12, chip: '6 PM', kind: 'later', meta: 'Mon, Wed, Sat', href: 'GymClosed.dc.html', week: ['off','done','off','miss','off','off','today'] },
      { name: 'Read 20 pages', flower: 'daisy', health: 'dormant', color: '#F7F2EA', stage: 'bud', chip: 'To do', kind: 'todo', meta: 'Dried up', href: 'ReviveDetail.dc.html', week: ['miss','miss','miss','miss','miss','miss','today'] },
      { name: 'Drink water', flower: 'sunflower', color: '#FFC93C', stage: 'bloom', count: 22, chip: 'Done', kind: 'done', meta: '8 times a day', href: 'Detail.dc.html', week: ['done','done','done','done','done','done','todayDone'] },
      { name: 'Stretch', flower: 'daisy', color: '#F7F2EA', stage: 'bloom', count: 9, chip: 'Done', kind: 'done', meta: 'Every day', href: 'Detail.dc.html', week: ['done','done','done','done','done','done','todayDone'] },
      { name: 'Call home', flower: 'spider', color: '#FF5A4E', stage: 'bloom', count: 6, chip: 'Rest day', kind: 'rest', meta: 'Next: Sunday', href: 'Detail.dc.html', week: ['done','off','off','off','off','off','todayRest'] },
      { name: 'Progress pic', flower: 'rose', health: 'wilt', photo: true, color: '#E8455A', stage: 'bloom', count: 3, chip: 'Snap', kind: 'snap', meta: 'Wilting', href: 'GymDetail.dc.html', week: ['done','done','done','off','done','miss','today'] }
    ];
    raw.splice(1, 0, { name: 'Morning walk', flower: 'sunflower', color: '#FFC93C', stage: 'bloom', count: 4, chip: '1/3', kind: 'progress', meta: 'Every day', group: [['M', '#FFC93C', '#3A2600'], ['S', '#A98BEA', '#1F1023']], href: 'GroupDetail.dc.html', week: ['done','done','done','done','done','done','today'] });
    var habits = raw.map(function (h) {
      return {
        status: h.kind === 'done' ? 'done' : h.kind === 'later' ? 'later' : h.kind === 'rest' ? 'rest' : 'todo',
        dim: h.kind === 'rest' ? '0.55' : '1',
        kind: h.flower, health: h.health || 'ok', metaColor: h.health === 'wilt' ? '#FFB894' : (h.health === 'dormant' ? '#FF7B7B' : '#B9A8C0'),
        name: h.name, color: h.color, meta: h.meta, href: h.href, chip: h.chip,
        tint: hexA(h.color, 0.14),
        isGroup: !!h.group, group: (h.group || []).map(function (g) { return { initial: g[0], style: 'width: 20px; height: 20px; margin-left: -5px; border-radius: 10px; background: ' + g[1] + '; color: ' + g[2] + '; box-shadow: 0 0 0 2px #2A1C2F; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800;' }; }),
        isDue: h.kind !== 'done' && h.kind !== 'later' && h.kind !== 'rest',
        hasCount: !!h.count, count: String(h.count || ''),
        countAria: h.count ? h.count + ' days in bloom' + (h.health === 'wilt' ? ', paused' : '') : '',
        countStyle: 'position: absolute; right: -10px; bottom: -6px; min-width: 24px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; background: #3D2D43; box-shadow: 0 0 0 3px #2A1C2F; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center;' + (h.health === 'wilt' ? ' color: #FFB894;' : ' color: #F6EEF8;'),
        isSeed: h.stage === 'seed', isBud: h.stage === 'bud', isBloom: h.stage === 'bloom',
        isDone: h.kind === 'done', isSnap: h.kind === 'snap', isLater: h.kind === 'later', isPhoto: !!h.photo,
        label: h.name + (h.photo ? ', photo check-in' : '') + ', ' + h.chip + ', ' + h.meta,
        chipStyle: chip(h.kind, h.color),
        week: h.week.map(function (s) { return { style: dot(s, h.color) }; })
      };
    });
    function rankTodo(h) { return h.health === 'wilt' ? 0 : h.health === 'dormant' ? 1 : 2; }
    var todo = habits.filter(function (h) { return h.status === 'todo'; }).sort(function (a, b) { return rankTodo(a) - rankTodo(b); });
    var later = habits.filter(function (h) { return h.status === 'later'; });
    var done = habits.filter(function (h) { return h.status === 'done'; });
    var gridStyle = 'display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;';
    var rowStyle = 'display: flex; gap: 12px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 2px 20px;';
    function asRow(list) { return list.map(function (h) { return Object.assign({}, h, { sizeStyle: 'width: 169px; flex-shrink: 0;' }); }); }
    function asGrid(list) { return list.map(function (h) { return Object.assign({}, h, { sizeStyle: '' }); }); }
    var sections = [];
    if (todo.length) sections.push({ title: 'Due now', hasTitle: false, color: '#F6EEF8', count: String(todo.length), items: asGrid(todo), listStyle: gridStyle });
    if (later.length) sections.push({ title: 'Later today', hasTitle: true, color: '#C9B9CF', count: String(later.length), items: asRow(later), listStyle: rowStyle });
    if (done.length) sections.push({ title: 'Complete', hasTitle: true, color: '#9BE36F', count: String(done.length), items: asRow(done), listStyle: rowStyle });
    var rest = habits.filter(function (h) { return h.status === 'rest'; });
    if (rest.length) sections.push({ title: 'Another day', hasTitle: true, color: '#8C7992', count: String(rest.length), items: asRow(rest), listStyle: rowStyle });
    var self = this;
    return { accent: accent, sections: sections,
      isAway: !this.state.awayOff, awayAttr: this.state.awayOff ? 'false' : 'true', awayInert: !this.state.awayOff,
      turnOffAway: function () { self.setState({ awayOff: true }); }
    };
  }
}
</script>
</body>
</html>
