<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paused habits</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A0E1E}
a{color:#C9B9CF;text-decoration:none}a:hover{color:#F6EEF8}
.hf-b:focus-visible,.hf-back:focus-visible{outline:2px solid #74D447;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1F1023; color: #F6EEF8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 16px; padding: 58px 20px 34px 20px; overflow: hidden">

  <a class="hf-back" href="Main.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; height: 44px; padding-right: 8px; font-size: 16px; font-weight: 600">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    Habits
  </a>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.4px">Paused</h1>
    <p style="margin: 0; font-size: 14px; font-weight: 500; color: #B9A8C0; line-height: 1.45">Kept safe under glass. Days here don’t count as missed.</p>
  </div>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
    <div role="status" style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: rgba(116,212,71,0.16); color: #C8F2AE; font-size: 14px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      <span style="flex: 1">{{toast}}</span>
      <button class="hf-b" onClick="{{undo}}" style="height: 32px; padding: 0 10px; border: none; border-radius: 16px; background: none; color: #F6EEF8; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer">Undo</button>
    </div>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{items}}" as="h" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 14px; padding: 12px 12px 12px 12px; border-radius: 20px; background: #2A1C2F">
        <div style="position: relative; width: 64px; height: 72px; flex-shrink: 0" aria-hidden="true">
          <div style="position: absolute; left: 10px; top: 20px">
            <dc-import name="Flower" kind="{{h.kind}}" stage="{{h.stage}}" size="44" hint-size="44px,44px"></dc-import>
          </div>
          <svg width="64" height="72" viewBox="0 0 64 72" style="position: absolute; inset: 0">
            <path d="M10 64V30a22 22 0 0 1 44 0v34z" fill="rgba(210,230,255,0.10)" stroke="rgba(220,235,255,0.6)" stroke-width="1.6"></path>
            <path d="M17 57V31a15 15 0 0 1 8-13" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2.2" stroke-linecap="round"></path>
            <circle cx="32" cy="6" r="3.2" fill="rgba(210,230,255,0.25)" stroke="rgba(220,235,255,0.6)" stroke-width="1.4"></circle>
            <rect x="5" y="63" width="54" height="7" rx="3.5" fill="#5A4660"></rect>
          </svg>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <p style="margin: 0; font-size: 16px; font-weight: 700">{{h.name}}</p>
          <p style="margin: 0; font-size: 13px; font-weight: 500; color: #B9A8C0">{{h.meta}}</p>
        </div>
        <button class="hf-b" onClick="{{h.restore}}" aria-label="{{h.aria}}" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: rgba(116,212,71,0.22); color: #B8EE98; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer">Restore</button>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
    <p style="margin: 24px 0 0 0; text-align: center; font-size: 15px; font-weight: 600; color: #B9A8C0">Nothing paused</p>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { restored: {}, last: null };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var all = [
      { id: 'gym', name: 'Hit the gym', kind: 'lavender', stage: 'bloom', meta: 'Paused today' },
      { id: 'med', name: 'Meditate', kind: 'blossom', stage: 'bud', meta: 'Paused 2 Oct' },
      { id: 'span', name: 'Spanish lesson', kind: 'tulip', stage: 'seed', meta: 'Paused 14 Sep' }
    ];
    var items = all.filter(function (h) { return !st.restored[h.id]; }).map(function (h) {
      return {
        name: h.name, kind: h.kind, stage: h.stage, meta: h.meta, aria: 'Restore ' + h.name,
        restore: function () {
          var r = Object.assign({}, self.state.restored); r[h.id] = true;
          self.setState({ restored: r, last: h });
        }
      };
    });
    return {
      items: items,
      isEmpty: items.length === 0,
      hasToast: !!st.last,
      toast: st.last ? st.last.name + ' is back on your Habits screen' : '',
      undo: function () {
        if (!self.state.last) return;
        var r = Object.assign({}, self.state.restored); delete r[self.state.last.id];
        self.setState({ restored: r, last: null });
      }
    };
  }
}
</script>
</body>
</html>
