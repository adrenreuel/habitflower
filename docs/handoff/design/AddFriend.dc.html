<html lang="en">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844},"search":{"type":"enum","options":["results","none"],"default":"results"}}'>

    ];
    var results = people.map(function (p, i) {
      var on = !!st.sent[p.id];
      return {
        name: p.name, handle: p.handle, initials: p.initials,
        avatarStyle: 'width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: ' + p.bg + '; color: ' + p.fg + '; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800;',
        divider: i < people.length - 1 ? '1px solid #3D2D43' : 'none',
        sentAttr: on ? 'true' : 'false',
        btnLabel: on ? 'Requested' : 'Add',
        btnStyle: 'height: 40px; min-width: 64px; padding: 0 16px; border-radius: 20px; border: none; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer;' + (on ? ' background: #3A2A40; color: #B9A8C0;' : ' background: rgba(116,212,71,0.22); color: #B8EE98;'),
        add: function () { var s = Object.assign({}, self.state.sent); s[p.id] = !s[p.id]; self.setState({ sent: s }); }
      };
    });
    var none = (this.props.search || 'results') === 'none';
    return {
      hasResults: !none, noResults: none, query: none ? 'alexx' : 'alex',
      results: results,
      copyLabel: st.copied ? 'Copied' : 'Copy link',
      showQr: !!st.qr, showGrid: !st.qr,
      qrAttr: st.qr ? 'true' : 'false',
      qrAria: st.qr ? 'Show HabitFlowers' : 'Show QR code',
      qrBtnStyle: 'width: 44px; height: 44px; border-radius: 22px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;' + (st.qr ? ' background: rgba(116,212,71,0.22); color: #B8EE98;' : ' background: rgba(31,16,35,0.6); color: #E4D7E9;'),
      toggleQr: function () { self.setState({ qr: !self.state.qr }); },
      qrPath: (function () {
        var n = 25, d = '', seed = 7;
        function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
        function finder(x, y) {
