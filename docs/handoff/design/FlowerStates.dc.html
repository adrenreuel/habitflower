<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flower states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A0E1E}
h1,.hf-display,div[role="status"]>h2{font-family:'Young Serif',Georgia,serif!important;font-weight:400!important;letter-spacing:-0.3px!important}
x-dc>div{position:relative}div[style*="border-radius"],section[style*="border-radius"],article[style*="border-radius"]{corner-shape:squircle}
</style>
</helmet>
<div style="width: 760px; height: 300px; box-sizing: border-box; padding: 28px; background: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22140%22%20height%3D%22140%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%220.85%22%20numOctaves%3D%223%22%20stitchTiles%3D%22stitch%22%2F%3E%3CfeColorMatrix%20values%3D%220%200%200%200%201%20%200%200%200%200%201%20%200%200%200%200%201%20%200%200%200%200.07%200%22%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20filter%3D%22url%28%23n%29%22%2F%3E%3C%2Fsvg%3E') 0 0 / 140px 140px, #1A0C1D; color: #F6EEF8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px">
  <p style="margin: 0; font-size: 18px; font-weight: 800">Flower states</p>
  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; flex: 1">
    <sc-for list="{{states}}" as="s" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; padding: 12px 8px; border-radius: 18px; background: #2A1C2F">
        <dc-import name="Flower" kind="lavender" stage="{{s.stage}}" health="{{s.health}}" size="96" hint-size="96px,96px"></dc-import>
        <p style="margin: 0; font-size: 15px; font-weight: 800; color: {{s.color}}">{{s.label}}</p>
        <p style="margin: 0; font-size: 12px; font-weight: 500; color: #B9A8C0; text-align: center; line-height: 1.35">{{s.rule}}</p>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      states: [
        { stage: 'seed', health: 'ok', label: 'Sprout', rule: 'Just planted. Missing a day dries it up', color: '#F6EEF8' },
        { stage: 'bud', health: 'ok', label: 'Bud', rule: 'After 1 check-in', color: '#F6EEF8' },
        { stage: 'bloom', health: 'ok', label: 'Bloom', rule: 'After 2. The number counts days in bloom', color: '#F6EEF8' },
        { stage: 'bloom', health: 'wilt', label: 'Wilting', rule: 'Missed 1 day. Count pauses until you check in', color: '#FFB894' },
        { stage: 'bloom', health: 'dormant', label: 'Dried up', rule: 'Missed 2 in a row (a sprout after 1). Count resets. Comes back a bud, or a sprout if it was one', color: '#FF7B7B' }
      ]
    };
  }
}
</script>
</body>
</html>
