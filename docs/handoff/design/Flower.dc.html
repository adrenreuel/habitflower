<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["sunflower","daisy","tulip","rose","spider","lavender","blossom","marigold"],"default":"sunflower"},"size":{"editor":"int","default":96,"min":24,"max":240},"stage":{"editor":"enum","options":["seed","bud","bloom"],"default":"bloom"},"health":{"editor":"enum","options":["ok","wilt","dormant"],"default":"ok"},"soil":{"editor":"enum","options":["on","off"],"default":"on"},"$preview":{"width":96,"height":96}}'>
class Component extends DCLogic {
  renderVals() {
    var k = this.props.kind ?? 'sunflower';
    var size = parseInt(this.props.size ?? 96, 10) || 96;
    var stage = this.props.stage ?? 'bloom';
    var b = stage === 'bloom';
    var health = this.props.health ?? 'ok';
    var ok = health !== 'wilt' && health !== 'dormant';
    function mix(hex, toHex, t) {
      var a = parseInt(hex.slice(1), 16), c = parseInt(toHex.slice(1), 16);
      var r = Math.round(((a >> 16) & 255) * (1 - t) + ((c >> 16) & 255) * t);
      var g = Math.round(((a >> 8) & 255) * (1 - t) + ((c >> 8) & 255) * t);
      var bl = Math.round((a & 255) * (1 - t) + (c & 255) * t);
      return 'rgb(' + r + ',' + g + ',' + bl + ')';
    }
    b = b && ok;
    var colors = { sunflower: '#FFC93C', daisy: '#F7F2EA', tulip: '#FF6B8A', rose: '#E8455A', spider: '#FF5A4E', lavender: '#A98BEA', blossom: '#FFB7C9', marigold: '#FF9F1C' };
    return {
      soilFill: (this.props.soil ?? 'on') === 'off' ? 'none' : '#6B4436',
      isWiltSeed: health === 'wilt' && stage === 'seed', isWiltBud: health === 'wilt' && stage === 'bud', isWiltBloom: health === 'wilt' && stage === 'bloom',
      isDormant: health === 'dormant',
      faded: mix(colors[k] || '#A98BEA', '#9A8A92', 0.4),
      fadedCenter: mix('#FFD24A', '#9A8A92', 0.45),
      petalFill: stage === 'seed' ? 'none' : mix(colors[k] || '#A98BEA', '#7A6A62', 0.55),
      isSeed: ok && stage === 'seed', isBud: ok && stage === 'bud', budColor: colors[k] || '#A98BEA',
      px: size + 'px',
      isSunflower: b && k === 'sunflower', isDaisy: b && k === 'daisy', isTulip: b && k === 'tulip', isRose: b && k === 'rose',
      isSpider: b && k === 'spider', isLavender: b && k === 'lavender', isBlossom: b && k === 'blossom', isMarigold: b && k === 'marigold'
    };
  }
}
