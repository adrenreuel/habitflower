          knobStyle: 'width: 24px; height: 24px; border-radius: 12px; background: ' + (on ? '#142008' : '#E4D7E9') + ';',
          tap: function () {
            if (isToggle) { var s = {}; s[r.toggle] = !self.state[r.toggle]; self.setState(s); }
            else if (r.pick) self.setState({ sheet: r.pick });
          }
        };
      }) };
    });
    var sh = st.sheet ? opts[st.sheet] : null;
    return {
      groups: out,
      sheetOpen: !!sh,
      sheetTitle: sh ? sh.title : '',
      sheetOptions: sh ? sh.list.map(function (l) {
        var on = st.vals[st.sheet] === l;
        return { label: l, on: on, pressed: on ? 'true' : 'false',
          style: 'height: 52px; border: none; border-radius: 16px; padding: 0 16px; font: inherit; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; cursor: pointer;' + (on ? ' background: rgba(116,212,71,0.22); color: #B8EE98;' : ' background: #3A2A40; color: #F6EEF8;'),
          pick: function () { var v = Object.assign({}, self.state.vals); v[self.state.sheet] = l; self.setState({ vals: v, sheet: null }); } };
      }) : [],
      close: function () { self.setState({ sheet: null }); }
    };
  }
}
</script>
</body>
</html>
