<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A0E1E}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.hf-b:focus-visible,.hf-tab:focus-visible,.hf-row:focus-visible{outline:2px solid #74D447;outline-offset:-2px}
.hf-row{transition:background .15s}.hf-row:hover{background:#33243A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #1F1023; color: #F6EEF8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 58px 20px 0 20px; display: flex; flex-direction: column; gap: 6px">
    <a class="hf-b" href="Main.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; height: 44px; padding-right: 8px; font-size: 16px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      Habits
    </a>
    <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.5px">Settings</h1>
  </header>
  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 14px 20px">

    <a class="hf-row" href="Account.dc.html" aria-label="Account, @reuel" style="border-radius: 22px; background: #2A1C2F; padding: 12px 14px 12px 12px; display: flex; align-items: center; gap: 12px">
      <span style="width: 52px; height: 52px; flex-shrink: 0; border-radius: 26px; background: #74D447; color: #142008; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800">R</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 18px; font-weight: 800">@reuel</span>
        <span style="font-size: 13px; font-weight: 600; color: #8C7992">Account</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C7992" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div role="list" style="border-radius: 22px; background: #2A1C2F; overflow: hidden; display: flex; flex-direction: column">
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
          <sc-if value="{{r.isLink}}" hint-placeholder-val="{{false}}">
          <a class="hf-row" role="listitem" href="{{r.href}}" aria-label="{{r.aria}}" style="{{r.rowStyle}}">
            <span aria-hidden="true" style="{{r.iconStyle}}">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; text-align: left"><span style="font-size: 15.5px; font-weight: 600">{{r.label}}</span><sc-if value="{{r.hasSub}}" hint-placeholder-val="{{false}}"><span style="font-size: 12.5px; font-weight: 500; color: #9BDB78">{{r.sub}}</span></sc-if></span>
            <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{false}}">
              <span aria-hidden="true" style="{{r.trackStyle}}"><span style="{{r.knobStyle}}"></span></span>
            </sc-if>
            <sc-if value="{{r.hasValue}}" hint-placeholder-val="{{true}}">
              <span style="{{r.valueStyle}}">{{r.value}}</span>
            </sc-if>
            <sc-if value="{{r.hasChevron}}" hint-placeholder-val="{{true}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E5C75" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
            </sc-if>
          </a>
          </sc-if>
          <sc-if value="{{r.isBtn}}" hint-placeholder-val="{{true}}">
          <button class="hf-row" role="listitem" onClick="{{r.tap}}" aria-label="{{r.aria}}" style="{{r.rowStyle}}">
            <span aria-hidden="true" style="{{r.iconStyle}}">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; text-align: left"><span style="font-size: 15.5px; font-weight: 600">{{r.label}}</span><sc-if value="{{r.hasSub}}" hint-placeholder-val="{{false}}"><span style="font-size: 12.5px; font-weight: 500; color: #9BDB78">{{r.sub}}</span></sc-if></span>
            <sc-if value="{{r.isToggle}}" hint-placeholder-val="{{false}}">
              <span aria-hidden="true" style="{{r.trackStyle}}"><span style="{{r.knobStyle}}"></span></span>
            </sc-if>
            <sc-if value="{{r.hasValue}}" hint-placeholder-val="{{true}}">
              <span style="{{r.valueStyle}}">{{r.value}}</span>
            </sc-if>
            <sc-if value="{{r.hasChevron}}" hint-placeholder-val="{{true}}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E5C75" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
            </sc-if>
          </button>
          </sc-if>
        </sc-for>
      </div>
    </sc-for>

    <button class="hf-b" style="height: 48px; flex-shrink: 0; border-radius: 22px; border: none; background: #2A1C2F; color: #FF7B7B; font: inherit; font-size: 15.5px; font-weight: 700; cursor: pointer">Sign out</button>
  </main>

  <sc-if value="{{sheetOpen}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; justify-content: flex-end">
      <button aria-label="Close" onClick="{{close}}" style="flex: 1; border: none; background: rgba(10,4,12,0.62); cursor: pointer"></button>
      <div role="dialog" aria-label="{{sheetTitle}}" style="background: #2A1C2F; border-radius: 28px 28px 0 0; padding: 10px 16px 38px 16px; display: flex; flex-direction: column; gap: 14px">
        <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #4A3A50"></span>
        <h2 style="margin: 0; padding: 0 4px; font-size: 20px; font-weight: 800">{{sheetTitle}}</h2>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{sheetOptions}}" as="o" hint-placeholder-count="3">
            <button class="hf-b" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="{{o.style}}">
              <span style="flex: 1; text-align: left">{{o.label}}</span>
              <sc-if value="{{o.on}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if>
            </button>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { away: false, notif: true, sheet: null, vals: { addMe: 'Everyone', share: 'Everyone', week: 'Sunday', reset: '12:00 AM' } };
  }
  renderVals() {
    var self = this, st = this.state;
    var I = {
      bell: 'M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4',
      heart: 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z',
      widget: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
      dome: 'M5 20h14M6 20v-7a6 6 0 0 1 12 0v7M12 20v-5',
      cal: 'M5 6h14v14H5zM5 10h14M9 3v4M15 3v4',
      moon: 'M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z',
      add: 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c0-3.4 2.9-5.8 6.5-5.8s6.5 2.4 6.5 5.8M19 8v6M16 11h6',
      eye: 'M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
      plane: 'M4 11a8 8 0 0 1 16 0zM12 11l-2.5 8.5M5 20.5h10',
      help: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01'
    };
    var C = { green: ['rgba(116,212,71,0.18)', '#B8EE98'], pink: ['rgba(242,143,184,0.18)', '#F7B3CF'], blue: ['rgba(122,167,255,0.18)', '#A9C6FF'], purple: ['rgba(169,139,234,0.20)', '#C9B6F4'], amber: ['rgba(255,201,60,0.18)', '#FFD873'], grey: ['#3A2A40', '#E4D7E9'] };
    var opts = {
      addMe: { title: 'Who can add me', list: ['Everyone', 'Friends of friends', 'No one'] },
      share: { title: 'New habits are shared with', list: ['Everyone', 'Close friends', 'Only me'] },
      week: { title: 'Week starts on', list: ['Sunday', 'Monday'] },
      reset: { title: 'New day starts at', list: ['12:00 AM', '2:00 AM', '4:00 AM'] }
    };
        var groups = [
      [
        { label: 'Notifications', icon: I.bell, color: 'pink', value: 'On', chevron: true, href: 'NotifSettings.dc.html' },
        { label: 'Apple Health', icon: I.heart, color: 'pink', value: 'Connected', good: true, chevron: true },
        { label: 'Widgets', icon: I.widget, color: 'blue', chevron: true, href: 'WidgetsHelp.dc.html' }
      ],
      [
        { label: 'Away mode', icon: I.plane, color: 'blue', toggle: 'away', sub: 'Nothing wilts while you’re away' },
        { label: 'Paused habits', icon: I.dome, color: 'purple', value: '2', chevron: true, href: 'Archived.dc.html' },
        { label: 'Week starts on', icon: I.cal, color: 'amber', pick: 'week' },
        { label: 'New day starts at', icon: I.moon, color: 'amber', pick: 'reset' }
      ],
      [
        { label: 'Help and feedback', icon: I.help, color: 'grey', chevron: true, href: 'HelpFeedback.dc.html' }
      ]
    ];
    var out = groups.map(function (g) {
      return { rows: g.map(function (r, i) {
        var c = C[r.color];
        var isToggle = !!r.toggle, on = isToggle && !!st[r.toggle];
        var value = r.pick ? st.vals[r.pick] : (r.value || '');
        return {
          label: r.label, icon: r.icon, value: value,
          aria: r.label + (isToggle ? (on ? ', on' : ', off') : (value ? ', ' + value : '')),
          hasSub: !!r.sub && on, sub: r.sub || '', isLink: !!r.href, isBtn: !r.href, href: r.href || '', isToggle: isToggle, hasValue: !!value, hasChevron: !!r.chevron || !!r.pick,
          rowStyle: 'width: 100%; min-height: 48px; border: none; border-bottom: ' + (i < g.length - 1 ? '1px solid #3D2D43' : 'none') + '; background: transparent; color: inherit; font: inherit; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 12px; cursor: pointer;',
          iconStyle: 'width: 30px; height: 30px; flex-shrink: 0; border-radius: 9px; background: ' + c[0] + '; color: ' + c[1] + '; display: flex; align-items: center; justify-content: center;',
          valueStyle: 'font-size: 14.5px; font-weight: 600; color: ' + (r.good ? '#9BDB78' : '#A895AE') + ';',
          trackStyle: 'width: 50px; height: 30px; border-radius: 15px; padding: 3px; box-sizing: border-box; display: flex; background: ' + (on ? '#74D447' : '#4A3A50') + '; justify-content: ' + (on ? 'flex-end' : 'flex-start') + ';',
          knobStyle: 'width: 24px; height: 24px; border-radius: 12px; background: ' + (on ? '#142008' : '#E4D7E9') + ';',
          tap: function () {
            if (isToggle) { var s = {}; s[r.toggle] = !self.state[r.toggle]; self.setState(s); }
            else if (r.pick) self.setState({ sheet: r.pick });
          }
        };
      }) };
    });
    var sh = st.sheet ? opts[st.sheet] : null;
    return {
      groups: out,
      sheetOpen: !!sh,
      sheetTitle: sh ? sh.title : '',
      sheetOptions: sh ? sh.list.map(function (l) {
        var on = st.vals[st.sheet] === l;
        return { label: l, on: on, pressed: on ? 'true' : 'false',
          style: 'height: 52px; border: none; border-radius: 16px; padding: 0 16px; font: inherit; font-size: 15.5px; font-weight: 700; display: flex; align-items: center; cursor: pointer;' + (on ? ' background: rgba(116,212,71,0.22); color: #B8EE98;' : ' background: #3A2A40; color: #F6EEF8;'),
          pick: function () { var v = Object.assign({}, self.state.vals); v[self.state.sheet] = l; self.setState({ vals: v, sheet: null }); } };
      }) : [],
      close: function () { self.setState({ sheet: null }); }
    };
  }
}
</script>
</body>
</html>
