<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A0E1E}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.hf-b:focus-visible,.hf-row:focus-visible,.hf-back:focus-visible{outline:2px solid #74D447;outline-offset:-2px}
.hf-row{transition:background .15s}.hf-row:hover{background:#33243A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #1F1023; color: #F6EEF8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 58px 20px 34px 20px; overflow: hidden">

  <a class="hf-back" href="Settings.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; height: 44px; padding-right: 8px; font-size: 16px; font-weight: 600">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    Settings
  </a>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 4px 0 6px 0">
    <span style="width: 88px; height: 88px; border-radius: 44px; background: #74D447; color: #142008; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 800">R</span>
    <h1 style="margin: 0; font-size: 24px; font-weight: 800">@reuel</h1>
  </div>

  <sc-if value="{{notLinked}}" hint-placeholder-val="{{true}}">
    <section aria-label="Back up" style="border-radius: 22px; background: #2A1C2F; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
          <h2 style="margin: 0; font-size: 17px; font-weight: 800">Back up your HabitFlowers</h2>
          <span style="flex-shrink: 0; height: 24px; padding: 0 10px; border-radius: 12px; background: rgba(255,158,107,0.16); color: #FFB894; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center">Not backed up</span>
        </div>
        <p style="margin: 0; font-size: 14px; font-weight: 500; line-height: 1.4; color: #B9A8C0">Keep them if you switch or lose your phone.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <button class="hf-b" onClick="{{linkApple}}" style="height: 52px; border-radius: 26px; border: none; background: #F6EEF8; color: #120814; font: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9s-2-.9-3.3-.9c-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.8 1.2 1.8 2.6 3.1 2.6 1.3-.1 1.7-.8 3.3-.8 1.5 0 1.9.8 3.3.8 1.4 0 2.2-1.3 3-2.5 1-1.4 1.4-2.8 1.4-2.8s-2.6-1-2.6-4.3zM14 5.1c.7-.8 1.1-1.9 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"></path></svg>Continue with Apple</button>
        <button class="hf-b" onClick="{{linkGoogle}}" style="height: 52px; border-radius: 26px; border: none; background: #3A2A40; color: #F6EEF8; font: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"></path><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"></path><path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2z"></path><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1z"></path></svg>Continue with Google</button>
      </div>
    </section>
  </sc-if>

  <div style="border-radius: 22px; background: #2A1C2F; overflow: hidden; display: flex; flex-direction: column">
    <a class="hf-row" href="ChangeUsername.dc.html" style="min-height: 52px; border: none; border-bottom: {{userDivider}}; background: transparent; color: inherit; font: inherit; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 16px; cursor: pointer">
      <span style="flex: 1; text-align: left; font-size: 15.5px; font-weight: 600">Username</span>
      <span style="font-size: 14.5px; font-weight: 600; color: #A895AE">@reuel</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E5C75" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <sc-if value="{{isLinked}}" hint-placeholder-val="{{false}}">
    <div style="min-height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px">
      <span style="flex: 1; font-size: 15.5px; font-weight: 600">Signed in with</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 600; color: #A895AE">
        <sc-if value="{{isApple}}" hint-placeholder-val="{{true}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.4 12.6c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9s-2-.9-3.3-.9c-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.8 1.2 1.8 2.6 3.1 2.6 1.3-.1 1.7-.8 3.3-.8 1.5 0 1.9.8 3.3.8 1.4 0 2.2-1.3 3-2.5 1-1.4 1.4-2.8 1.4-2.8s-2.6-1-2.6-4.3zM14 5.1c.7-.8 1.1-1.9 1-3.1-1 0-2.2.7-2.9 1.5-.6.7-1.2 1.9-1 3 1.1.1 2.2-.6 2.9-1.4z"></path></svg></sc-if>
        {{linkedName}}
      </span>
    </div>
    </sc-if>
  </div>

  <div style="border-radius: 22px; background: #2A1C2F; overflow: hidden">
    <button class="hf-row" onClick="{{openBlocked}}" aria-haspopup="dialog" style="width: 100%; min-height: 52px; border: none; background: transparent; color: inherit; font: inherit; display: flex; align-items: center; gap: 12px; padding: 0 14px 0 16px; cursor: pointer">
      <span style="flex: 1; text-align: left; font-size: 15.5px; font-weight: 600">Blocked</span>
      <span style="font-size: 14.5px; font-weight: 600; color: #A895AE">{{blockedCount}}</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E5C75" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
  </div>

  <button class="hf-b" onClick="{{openDelete}}" aria-haspopup="dialog" style="margin-top: auto; height: 52px; border-radius: 22px; border: none; background: #2A1C2F; color: #FF7B7B; font: inherit; font-size: 15.5px; font-weight: 700; cursor: pointer">Delete account</button>

  <sc-if value="{{deleteOpen}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 6; background: rgba(10,4,12,0.72); display: flex; flex-direction: column; justify-content: flex-end">
      <button aria-label="Close" onClick="{{close}}" style="flex: 1; border: none; background: none; cursor: pointer"></button>
      <section role="dialog" aria-label="Delete your account?" style="background: #241628; border-radius: 28px 28px 0 0; padding: 10px 20px 34px 20px; display: flex; flex-direction: column; gap: 14px">
        <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #4A3950"></div>
        <h2 style="margin: 4px 2px 0 2px; font-size: 21px; font-weight: 800">Delete your account?</h2>
        <p style="margin: 0 2px; font-size: 14.5px; font-weight: 500; line-height: 1.45; color: #B9A8C0">Your HabitFlowers, tasks, photos and friends will be deleted for good.</p>
        <button class="hf-b" style="height: 52px; border-radius: 26px; border: none; background: #FF7B7B; color: #2A0808; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Delete account</button>
        <button class="hf-b" onClick="{{close}}" style="height: 52px; border-radius: 26px; border: none; background: #3A2A40; color: #F6EEF8; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Cancel</button>
      </section>
    </div>
  </sc-if>

  <sc-if value="{{blockedOpen}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 6; background: rgba(10,4,12,0.72); display: flex; flex-direction: column; justify-content: flex-end">
      <button aria-label="Close" onClick="{{close}}" style="flex: 1; border: none; background: none; cursor: pointer"></button>
      <section role="dialog" aria-label="Blocked" style="background: #241628; border-radius: 28px 28px 0 0; padding: 10px 20px 34px 20px; display: flex; flex-direction: column; gap: 14px">
        <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #4A3950"></div>
        <h2 style="margin: 4px 2px 0 2px; font-size: 21px; font-weight: 800">Blocked</h2>
        <div style="border-radius: 18px; background: #2A1C2F; display: flex; flex-direction: column">
          <sc-for list="{{blocked}}" as="b" hint-placeholder-count="1">
            <div style="display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 8px 10px 8px 14px; box-sizing: border-box; border-bottom: {{b.divider}}">
              <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: #4A3A50; color: #E4D7E9; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">{{b.initial}}</span>
              <span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 700">{{b.name}}</span>
              <button class="hf-b" onClick="{{b.unblock}}" style="height: 38px; padding: 0 16px; border-radius: 19px; border: none; background: #3A2A40; color: #F6EEF8; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Unblock</button>
            </div>
          </sc-for>
          <sc-if value="{{noneBlocked}}" hint-placeholder-val="{{false}}">
            <p style="margin: 0; padding: 18px 16px; font-size: 14.5px; font-weight: 500; color: #B9A8C0">No one</p>
          </sc-if>
        </div>
      </section>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sheet: null, linked: null, blocked: ['@flowerspam'] };
  }
  renderVals() {
    var self = this, st = this.state;
    return {
      isLinked: !!st.linked, notLinked: !st.linked,
      linkedName: st.linked === 'google' ? 'Google' : 'Apple', isApple: st.linked !== 'google',
      userDivider: st.linked ? '1px solid #3D2D43' : 'none',
      linkApple: function () { self.setState({ linked: 'apple' }); },
      linkGoogle: function () { self.setState({ linked: 'google' }); },
      blockedCount: String(st.blocked.length),
      deleteOpen: st.sheet === 'delete',
      blockedOpen: st.sheet === 'blocked',
      noneBlocked: st.blocked.length === 0,
      blocked: st.blocked.map(function (n, i) {
        return { name: n, initial: n.charAt(1).toUpperCase(), divider: i < st.blocked.length - 1 ? '1px solid #3D2D43' : 'none',
          unblock: function () { self.setState({ blocked: self.state.blocked.filter(function (x) { return x !== n; }) }); } };
      }),
      openDelete: function () { self.setState({ sheet: 'delete' }); },
      openBlocked: function () { self.setState({ sheet: 'blocked' }); },
      close: function () { self.setState({ sheet: null }); }
    };
  }
}
</script>
</body>
</html>
