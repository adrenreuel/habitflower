<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task: Grocery run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1A0E1E}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.hf-b:focus-visible,.hf-row:focus-visible,.hf-back:focus-visible{outline:2px solid #74D447;outline-offset:-2px}
.hf-row{transition:background .15s}.hf-row:hover{background:#33243A}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #1F1023; color: #F6EEF8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 18px; padding: 58px 20px 16px 20px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a class="hf-back" href="Tasks.dc.html" style="display: inline-flex; align-items: center; gap: 4px; height: 44px; padding-right: 8px; font-size: 16px; font-weight: 600">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
        Tasks
      </a>
      <a href="EditTask.dc.html" style="height: 44px; padding: 0 16px; border-radius: 22px; background: #2A1C2F; color: #F6EEF8; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; box-sizing: border-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13.5 6.5l4 4"></path></svg>Edit</a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 2px">
      <h1 style="{{titleStyle}}">Grocery run</h1>
      <p style="margin: 0; font-size: 15px; font-weight: 500; color: #B9A8C0">Oat milk, not almond</p>
    </div>

    <div style="border-radius: 22px; background: #2A1C2F; display: flex; flex-direction: column; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-bottom: 1px solid #3D2D43">
        <span aria-hidden="true" style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 9px; background: rgba(122,167,255,0.18); color: #A9C6FF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6h14v14H5zM5 10h14M9 3v4M15 3v4"></path></svg></span>
        <span style="flex: 1; font-size: 15px; font-weight: 600">Due</span>
        <span style="font-size: 14.5px; font-weight: 600; color: #B9A8C0">{{dueLabel}}</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-bottom: 1px solid #3D2D43">
        <span aria-hidden="true" style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 9px; background: rgba(169,139,234,0.20); color: #C9B6F4; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l3 3-3 3"></path><path d="M4 12V10a4 4 0 0 1 4-4h12"></path><path d="M7 21l-3-3 3-3"></path><path d="M20 12v2a4 4 0 0 1-4 4H4"></path></svg></span>
        <span style="flex: 1; font-size: 15px; font-weight: 600">Repeats</span>
        <span style="font-size: 14.5px; font-weight: 600; color: #B9A8C0">Every Saturday</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px">
        <span aria-hidden="true" style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 9px; background: rgba(116,212,71,0.18); color: #B8EE98; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg></span>
        <span style="flex: 1; font-size: 15px; font-weight: 600">Shared with</span>
        <span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 600; color: #B9A8C0"><span style="width: 24px; height: 24px; border-radius: 12px; background: #FFC93C; color: #3A2600; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800">M</span>@mayac</span>
      </div>
    </div>

    <section aria-label="Checklist" style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 18px; font-weight: 700">Checklist</h2>
        <span style="font-size: 14px; font-weight: 700; color: #B9A8C0">{{subCount}}</span>
      </div>
      <div style="border-radius: 22px; background: #2A1C2F; display: flex; flex-direction: column; overflow: hidden">
        <sc-for list="{{subs}}" as="it" hint-placeholder-count="3">
          <button class="hf-row" role="checkbox" aria-checked="{{it.attr}}" onClick="{{it.toggle}}" style="display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 16px; border: none; border-bottom: 1px solid #3D2D43; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer">
            <span style="{{it.boxStyle}}"><sc-if value="{{it.done}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#142008" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></sc-if></span>
            <span style="{{it.labelStyle}}">{{it.label}}</span>
          </button>
        </sc-for>
        <button class="hf-row" onClick="{{addSub}}" style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 16px; border: none; background: none; color: #B8EE98; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg>
          Add item
        </button>
      </div>
    </section>
  </div>

  <footer style="flex-shrink: 0; padding: 12px 20px 30px 20px; border-top: 1px solid #33243A; display: flex; flex-direction: column; gap: 8px">
    <sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
      <button class="hf-b" onClick="{{complete}}" style="height: 54px; border-radius: 27px; border: none; background: #74D447; color: #142008; font: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        Mark as done
      </button>
    </sc-if>
    <sc-if value="{{isDone}}" hint-placeholder-val="{{false}}">
      <div role="status" style="height: 54px; border-radius: 27px; background: rgba(116,212,71,0.16); display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 20px">
        <span style="font-size: 15px; font-weight: 700; color: #C8F2AE">Done. Next one Sat, Nov 21</span>
        <button class="hf-b" onClick="{{undo}}" style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: rgba(0,0,0,0.2); color: #F6EEF8; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer">Undo</button>
      </div>
    </sc-if>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: false, subs: [['Milk', true], ['Eggs', false], ['Bread', false]] };
  }
  renderVals() {
    var self = this, st = this.state;
    var n = st.subs.filter(function (x) { return x[1]; }).length;
    return {
      notDone: !st.done, isDone: st.done,
      dueLabel: 'Today, 6:00 PM',
      titleStyle: 'margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.4px;' + (st.done ? ' color: #8C7992; text-decoration: line-through;' : ''),
      subCount: n + ' of ' + st.subs.length,
      subs: st.subs.map(function (x, i) {
        return { label: x[0], done: x[1], attr: x[1] ? 'true' : 'false',
          boxStyle: 'width: 24px; height: 24px; flex-shrink: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: ' + (x[1] ? '#74D447' : '#3D2D43') + ';',
          labelStyle: 'flex: 1; font-size: 15.5px; font-weight: 600;' + (x[1] ? ' color: #8C7992; text-decoration: line-through;' : ''),
          toggle: function () { var a = self.state.subs.map(function (y) { return y.slice(); }); a[i][1] = !a[i][1]; self.setState({ subs: a }); } };
      }),
      addSub: function () { self.setState({ subs: self.state.subs.concat([['Coffee', false]]) }); },
      complete: function () { self.setState({ done: true, subs: self.state.subs.map(function (y) { return [y[0], true]; }) }); },
      undo: function () { self.setState({ done: false }); }
    };
  }
}
</script>
</body>
</html>
