services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: habitflower
      POSTGRES_USER: habitflower
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habitflower -d habitflower"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published: only the api container can reach Postgres.

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://habitflower:${POSTGRES_PASSWORD}@db:5432/habitflower
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.habitflower.app}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
